<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Email OTP Demo</title>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 400px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      h3 {
        margin-bottom: 10px;
        color: #555;
      }

      p {
        text-align: center;
        margin-bottom: 15px;
        font-weight: 600;
      }

      hr {
        margin: 20px 0;
        border: none;
        border-top: 1px solid #ddd;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
      }

      input:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
      }

      button {
        padding: 12px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #357abd;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Email OTP Verification Demo</h2>

      <p th:text="${message}" style="color: green"></p>

      <hr />

      <h3>Send OTP</h3>

      <form action="/send-otp" method="post">
        <input type="email" name="email" placeholder="Enter Email" required />

        <button type="submit">Send OTP</button>
      </form>

      <hr />

      <h3>Verify OTP</h3>

      <form action="/verify-otp" method="post">
        <input
          type="email"
          name="email"
          placeholder="Enter Email"
          th:value="${email}"
          required
        />

        <br /><br />

        <input type="text" name="otp" placeholder="Enter OTP" required />

        <button type="submit">Verify OTP</button>
      </form>
    </div>
  </body>
</html>
