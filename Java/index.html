    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSK Shipping | Global Logistics</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Only custom CSS needed is for the floating WhatsApp button */
      .whatsapp-float {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
        background-color: #25d366;
        color: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s;
      }
      .whatsapp-float:hover {
        transform: scale(1.1);
        color: white;
      }
    </style>

  <body class="bg-light">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-59Z7BXN9"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">MSK Shipping</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-primary text-white text-center py-5">
      <div class="container py-5">
        <h1 class="display-4 fw-bold">Reliable Global Shipping</h1>
        <p class="lead">Your trusted partner in freight and logistics.</p>
      </div>
    </header>

    <!-- Contact Form Section -->
    <section class="container mb-5" style="margin-top: -60px">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow border-0">
            <div class="card-body p-4 p-md-5">
              <h3 class="text-center text-primary mb-4">Request a Quote</h3>

              <!-- Form method set to GET for localhost testing to avoid 405 errors -->
              <form action="/thank-you.html" method="GET">
                <div class="mb-3">
                  <label class="form-label fw-bold">Name *</label>
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                    placeholder="John Doe"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Company</label>
                  <input
                    type="text"
                    name="company"
                    class="form-control"
                    placeholder="Company Ltd."
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Email *</label>
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                    placeholder="john@example.com"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">WhatsApp Number *</label>
                  <input
                    type="tel"
                    name="mobile"
                    class="form-control"
                    required
                    placeholder="+1 234 567 8900"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Service Required *</label>
                  <select name="service" class="form-select" required>
                    <option value="">-- Select a Service --</option>
                    <option value="ocean-freight">Ocean Freight</option>
                    <option value="air-freight">Air Freight</option>
                    <option value="customs-clearance">Customs Clearance</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Message</label>
                  <textarea
                    name="message"
                    class="form-control"
                    rows="3"
                    placeholder="Shipping requirements..."
                  ></textarea>
                </div>
                <button
                  type="submit"
                  class="btn btn-warning w-100 fw-bold py-2"
                >
                  Submit Enquiry
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <a
      href="https://wa.me/1234567890"
      class="whatsapp-float"
      target="_blank"
      aria-label="Chat on WhatsApp"
    >
      <svg width="35" height="35" fill="currentColor" viewBox="0 0 448 512">
        <path
          d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157.1zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"
        />
      </svg>
    </a>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
      <p class="mb-0">&copy; 2026 MSK Shipping. All rights reserved.</p>
    </footer>
  </body>
</html>
